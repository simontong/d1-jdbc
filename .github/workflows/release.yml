name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release needs write access, and signing the files needs the other two.
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: ./gradlew build -PreleaseVersion="${GITHUB_REF_NAME#v}"
      # Checks the plugin against the current PhpStorm and DataGrip releases.
      - run: ./gradlew :ide-plugin:verifyPlugin -PreleaseVersion="${GITHUB_REF_NAME#v}"
      # Records where and how the files were built, so anyone can check them.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/libs/d1-jdbc-*-all.jar
            ide-plugin/build/distributions/d1-jdbc-ide-plugin-*.zip
      # Immutable releases lock a release when it's published, so attach the files to a draft first.
      - run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes \
            build/libs/d1-jdbc-*-all.jar ide-plugin/build/distributions/d1-jdbc-ide-plugin-*.zip
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
