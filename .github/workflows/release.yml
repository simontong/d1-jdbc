name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" build/libs/d1-jdbc-*-all.jar ide-plugin/build/libs/d1-jdbc-ide-plugin-*.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
