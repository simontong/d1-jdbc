name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache, as the default one is proprietary.
          cache-provider: basic
      # Live tests skip themselves, as CI has no D1 token.
      - run: ./gradlew build
